name: CD PROD
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  cd:
    name: Build & Push GitHub Package & Deploy on AWS Lightsail
    runs-on: ubuntu-22.04

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Prepare container image metadata
        run: |
          echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ghcr.io/${{ env.REPOSITORY }}:latest

      - name: 🚀 Deploy on AWS Lightsail
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN }}
          script_stop: true
          script: |
            printf '%s' "${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker network create devopsNet || true
            docker pull ghcr.io/${{ env.REPOSITORY }}:${{ env.VERSION }}
            docker rm -f ${{ env.ARTIFACT }} || true
            
            docker run -d \
              --name ${{ env.ARTIFACT }} \
              --restart always \
              --memory 512m \
              --memory-swap 1024m \
              --network devopsNet \
              -p 80:10000 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_DATASOURCE_URL="jdbc:postgresql://postgres-server:5432/${{ secrets.POSTGRES_DB }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.POSTGRES_USER }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
              -e JAVA_OPTS="-XX:MaxRAMPercentage=75.0" \
              ghcr.io/${{ env.REPOSITORY }}:${{ env.VERSION }}

            echo "⏳ Esperando a que el servicio esté ready..."
            HEALTHY=false
            for i in $(seq 1 8); do
              sleep 15
              if curl -fsS http://localhost/actuator/health | grep -q '"status":"UP"'; then
                HEALTHY=true
                break
              fi
              echo "Intento $i: todavía no responde"
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Deploy fallido"
              docker logs --tail 50 ${{ env.ARTIFACT }}
              exit 1
            fi

            echo "✅ Deploy exitoso"
            docker image prune --filter "until=12h" -f

      - name: ✅ Public health check
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            "http://${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}/actuator/health"