spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://postgres-server:5432/devopsDb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: WARN
    es.upm.miw: DEBUG