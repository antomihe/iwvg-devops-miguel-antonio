server:
  port: 10000

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-server:5432/devops_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

springdoc:
  # ⚠️ ADVERTENCIA DE SEGURIDAD (Entorno Académico)
  # Se mantienen 'enabled: true' para facilitar la evaluación y uso educativo de Swagger.
  # En un entorno de producción real, ambas propiedades DEBEN estar en 'false' para evitar
  # exponer la documentación de la API públicamente.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true