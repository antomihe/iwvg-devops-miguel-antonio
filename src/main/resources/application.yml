spring:
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  output:
    ansi:
      enabled: ALWAYS
  cache:
    type: none
  jackson:
    default-property-inclusion: NON_NULL

info:
  app:
    artifact: "@project.artifactId@"
    version: "@project.version@"
    build: "@maven.build.timestamp@"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true