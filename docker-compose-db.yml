version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-server
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iwvg_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devopsNet

volumes:
  postgres_data:
    name: "postgres-data"

networks:
  devopsNet:
    external: true