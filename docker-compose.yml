services:
  devops:
    build: .
    image: devops:latest
    container_name: devops1
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-server:5432/${POSTGRES_DB:-iwvg_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - postgres-server
    networks:
      - devopsNet

  postgres-server:
    image: postgres:15-alpine
    container_name: postgres-server
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iwvg_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devopsNet

volumes:
  postgres_data:
    name: "postgres-data"

networks:
  devopsNet:
    name: devopsNet